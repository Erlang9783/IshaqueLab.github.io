# Curated list shown above the live OpenAlex feed on /publications/.
- citation: Sun et al., Nature Methods (2026)
  title: "Beyond benchmarking: an expert-guided consensus approach to spatially aware clustering"
  doi: 10.1038/s41592-026-03194-8
  why: Community benchmark of spatial clustering methods from SpaceHack; introduces SACCELERATOR.

- citation: Tiesmeyer et al., Nature Biotechnology (2026)
  title: Identifying 3D signal overlaps in spatial transcriptomics data with ovrlpy
  doi: 10.1038/s41587-026-03004-8
  why: ovrlpy shows that vertical cell overlap in imaging-based SRT is a pervasive, detectable source of error.

- citation: Müller-Bötticher et al., Genome Biology (2025)
  title: "SpatialLeiden: spatially aware Leiden clustering"
  doi: 10.1186/s13059-025-03489-7
  why: SpatialLeiden and multiSPAETI, spatially-aware clustering and dimensionality reduction that scale to millions of cells.

- citation: Bolduan et al., Scientific Reports (2025)
  title: Small intestinal neuroendocrine tumors lack early genomic drivers, acquire DNA repair defects and harbor hallmarks of low REST expression
  doi: 10.1038/s41598-025-01912-4
  why: Integrated whole-genome and transcriptomic profiling reveals that small intestinal neuroendocrine tumors originate from low-REST enterochromaffin cells without clear recurrent somatic driver mutations, with DNA repair defects driving later progression.

- citation: Nonn et al., Hypertension (2025)
  title: Senescent Syncytiotrophoblast Secretion During Early Onset Preeclampsia
  doi: 10.1161/hypertensionaha.124.23362
  why: Single-nucleus and spatial profiling show that premature syncytiotrophoblast senescence releases SASP markers (PAI-1, activin A, GDF15) into maternal blood weeks before early-onset preeclampsia manifests, serving as early predictive biomarkers.
